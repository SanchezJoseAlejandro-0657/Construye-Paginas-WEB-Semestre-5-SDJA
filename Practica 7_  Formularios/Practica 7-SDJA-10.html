<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formularios en HTML</title>
<!-- Importacion de hoja de estilos externa desde servidor CDN para la libreria de iconos FontAwesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.1/css/all.min.css">
</head>
<!-- Sanchez Dominguez Jose Alejandro -->
<!-- 5ºI -->
<!-- 0657 -->
<body>
<h2>Formularios con agrupamiento</h2> 
<form action="" method="post"> <!--Contenedor form configurado con el metodo HTTP POST para el envio de datos en el cuerpo de la peticion-->
<fieldset> <!--Elemento fieldset utilizado para agrupar visual y semanticamente controles relacionados dentro del formulario-->
<legend>Datos personales</legend> <!--Etiqueta legend que define el titulo o subtitulo descriptivo para el bloque fieldset-->
Nombre y apellido: 
  
<input type="text" name="nombre_apellido"><br> <!--Control alfanumerico de entrada tipo text para capturar el nombre completo con salto de linea-->
Documento valido: 
<input type="file" name="documento"><br> <!--Control de entrada tipo file para adjuntar el documento digital con salto de linea-->
Fecha de nacimiento:
<input type="date" name="fecha_nacimiento"> <!--Control especial tipo date que despliega un calendario nativo para seleccion temporal-->
</fieldset> <!--Etiqueta de cierre que delimita el primer bloque agrupado-->
<fieldset> <!--Elemento fieldset que crea la segunda agrupacion logica de campos-->
  
<legend>Datos de estudio:</legend> <!--Etiqueta legend que establece la cabecera para el grupo de informacion academica-->
Nombre de la escuela: 
<input type="text" name="escuela"><br> <!--Control alfanumerico tipo text para la institucion educativa con salto de linea-->
Certificado valido: 
<input type="file" name="certificado"><br> <!--Control de entrada tipo file para adjuntar el certificado con salto de linea-->
Fecha de egreso: 
<input type="date" name="fecha_egreso"> <!--Control tipo date para capturar la fecha de conclusion de estudios-->
</fieldset> <!--Etiqueta de cierre que delimita el segundo bloque agrupado-->
<br> 
<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i></button> <!--Elemento button de tipo submit que dispara el evento de envio procesando la peticion HTTP e incrusta un icono mediante la etiqueta i-->
<button type="reset">Borrar <i class="fa fa-trash"></i></button> <!--Elemento button de tipo reset que restablece los controles a sus valores por defecto e incluye un icono vectorial en su diseño-->
</form> <!--Etiqueta de cierre que delimita el scope del elemento form-->
</body>
</html>
